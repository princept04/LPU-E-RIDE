<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPU E-RIDE - Forgot Password</title>
    <link rel="stylesheet" href="./bootstrap-5.3.3-dist/css/bootstrap.css">

    <style>
        body {
            background: url('./young-woman-riding-electric-scooter (1).jpg') no-repeat center center/cover;
            height: 100vh;
        }

        .bg-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center text-white flex-column">

    <div class="container">
        <div class="bg-overlay rounded-4 shadow-lg p-4 text-center mx-auto" style="max-width: 350px;">
            <img src="./download.jpg" alt="LPU Logo" class="logo mb-3">
            <h1 class="text-warning mb-3 fs-4 fw-bold">Forgot Password</h1>
            <p class="mb-3">Enter your registered email to reset your password.</p>
            <form id="forgotPasswordForm">
                <div class="mb-3">
                    <input type="email" class="form-control bg-transparent text-white" id="email" placeholder="Email Address" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Send Reset Link</button>
            </form>
            <a href="login.html" class="text-warning mt-3 d-block">Back to Login</a>
            <a href="#" class="text-warning">Back to Home</a>
        </div>
    </div>

</body>

</html>
