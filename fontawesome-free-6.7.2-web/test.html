<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LPU E-RIDE Plan Confirmation</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- QRCode.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('/young-woman-riding-electric-scooter.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent */
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      width: 400px;
      backdrop-filter: blur(8px);
    }

    h2 {
      text-align: center;
      color: #ff6f00;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .btn-custom {
      width: 100%;
      padding: 12px;
      background-color: #ff6f00;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #e65100;
    }

    #qrcode {
      text-align: center;
      margin-top: 20px;
      display: none; /* Initially hidden */
    }

    canvas {
      width: 200px;
      height: 200px;
      margin-top: 15px;
      border: 2px solid #ff6f00;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>LPU E-RIDE Subscription</h2>
    <form id="paymentForm">
      <div class="mb-3">
        <input type="text" id="user_name" name="user_name" class="form-control" placeholder="Your Name" required />
      </div>
      
      <div class="mb-3">
        <input type="email" id="user_email" name="user_email" class="form-control" placeholder="Your Email" required />
      </div>
      
      <div class="mb-3">
        <select id="selected_plan" name="selected_plan" class="form-select" required>
          <option value="">-- Select Plan --</option>
          <option value="₹450/month">₹450/month</option>
          <option value="₹1200/3 months">₹1200/3 months</option>
          <option value="₹2200/6 months">₹2200/6 months</option>
        </select>
      </div>
      
      <button type="submit" class="btn-custom">Confirm Plan</button>
    </form>

    <!-- Div to show the generated QR code -->
    <div id="qrcode"></div>
  </div>

  <script>
    emailjs.init("ULhtWBtKg_fLihR_I"); // Your EmailJS public key

    document.getElementById("paymentForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const templateParams = {
        user_name: document.getElementById("user_name").value,
        user_email: document.getElementById("user_email").value,
        plan_name: document.getElementById("selected_plan").value,
        to_email: document.getElementById("user_email").value
      };

      emailjs.send("service_ol3l22a", "template_k13arvj", templateParams)
        .then(function(response) {
          alert("Email sent successfully!");
          console.log("Success:", response);
        }, function(error) {
          alert("Failed to send email: " + JSON.stringify(error));
          console.log("Error:", error);
        });

      // Get the selected plan value
      const selectedPlan = document.getElementById("selected_plan").value;
      
      // Based on the selected plan, create a unique payment URL
      let paymentUrl = '';
      if (selectedPlan === '₹450/month') {
        paymentUrl = 'https://your-website.com/payment/450';
      } else if (selectedPlan === '₹1200/3 months') {
        paymentUrl = 'https://your-website.com/payment/1200';
      } else if (selectedPlan === '₹2200/6 months') {
        paymentUrl = 'https://your-website.com/payment/2200';
      }

      // Show the QR code with the payment URL
      if (paymentUrl) {
        document.getElementById("qrcode").style.display = 'block'; // Show QR code container
        QRCode.toCanvas(document.getElementById('qrcode'), paymentUrl, function (error) {
          if (error) {
            console.error(error);
            alert('Error generating QR code!');
          } else {
            console.log('QR code generated successfully!');
          }
        });
      }

      event.target.reset(); // Reset the form
    });
  </script>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
