
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPU E-RIDE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./fontawesome-free-6.7.2-web/css/all.css">
  <style>
    body {
      background: url('./young-woman-riding-electric-scooter.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-overlay {
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>

<body class="text-white">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">LPU E-RIDE</a>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Go to the home page">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="subscription.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View and choose ride plans">Plans</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="ride history.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="See your previous rides">Ride History</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bg-overlay"></div>

  <div class="container d-flex justify-content-center align-items-center h-100">
    <div class="card text-center bg-dark text-light p-5" style="max-width: 650px; opacity: 0.89;">
      <img src="./download.jpg" alt="LPU E-RIDE" class="rounded-circle border border-warning mb-5" style="width: 220px;">
      
      <h2 >Explore Campus with Ease</h2>
      
      <p>
        LPU E-RIDE is your ultimate companion for quick and hassle-free campus transportation. No more waiting—just ride and go!
      </p>

      <a href="subscription.html" class="btn btn-warning fw-bold position-relative" data-bs-toggle="tooltip" data-bs-placement="bottom"title="Click to view subscription plans and start riding">
        <span class="spinner-grow spinner-grow-sm"></span>
        Start Riding
      </a>

    </div>
  </div>

  <script src="/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });
  </script>
</body>

</html>
